<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1C33" />
      <stop offset="50%" stop-color="#0F294A" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7718" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(197, 155, 39, 0.08)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(197, 155, 39, 0.25)" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Royal Navy Background -->
  <rect width="1200" height="480" fill="url(#bgGradient)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Gold Trim Borders -->
  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#goldGradient)" stroke-width="5" />
  <line x1="0" y1="476" x2="1200" y2="476" stroke="url(#goldGradient)" stroke-width="4" />

  <!-- Left: Institutional Crest & Title Block -->
  <g transform="translate(80, 80)">
    <!-- University Crest Emblem -->
    <circle cx="48" cy="48" r="44" fill="#0A1C33" stroke="url(#goldGradient)" stroke-width="2.5" />
    <path d="M 48 24 L 64 36 L 64 56 C 64 68 48 76 48 76 C 48 76 32 68 32 56 L 32 36 Z" fill="none" stroke="#C59B27" stroke-width="2" />
    <path d="M 42 48 L 48 54 L 56 42" fill="none" stroke="#F3E5AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Badges -->
    <rect x="110" y="14" width="230" height="26" rx="13" fill="rgba(197, 155, 39, 0.15)" stroke="#C59B27" stroke-width="1.2" />
    <text x="225" y="31" fill="#F3E5AB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">PRESIDENCY UNIVERSITY OFFICIAL</text>

    <rect x="350" y="14" width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.18)" stroke="#10B981" stroke-width="1.2" />
    <text x="415" y="31" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">v2.0 FLAGSHIP</text>

    <!-- Main Headline -->
    <text x="110" y="85" fill="#FFFFFF" font-family="'Merriweather', 'Playfair Display', Georgia, serif" font-size="46" font-weight="900" letter-spacing="-0.5">CampusFlow <tspan fill="url(#goldGradient)">AI</tspan></text>
    <text x="110" y="118" fill="#DFB847" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="0.3">Autonomous Spatial Infrastructure &amp; Rapid Hazard Triage Platform</text>
    
    <text x="110" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" width="500">
      Enterprise Multi-Tier Architecture: Flutter Mobile + React Spatial Twin + Gemini Multimodal AI
    </text>

    <!-- Stat Pills -->
    <g transform="translate(110, 185)">
      <rect x="0" y="0" width="140" height="58" rx="12" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="18" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">AI TRIAGE LATENCY</text>
      <text x="18" y="46" fill="#F3E5AB" font-family="monospace" font-size="18" font-weight="800">&lt; 1.2 sec</text>

      <rect x="155" y="0" width="140" height="58" rx="12" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="173" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">SPATIAL ACCURACY</text>
      <text x="173" y="46" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="800">100% Geotagged</text>

      <rect x="310" y="0" width="140" height="58" rx="12" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="328" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">REAL-TIME SYNC</text>
      <text x="328" y="46" fill="#34D399" font-family="monospace" font-size="18" font-weight="800">Socket.io Bus</text>
    </g>
  </g>

  <!-- Right: Glassmorphic Interactive Console Mockup -->
  <g transform="translate(730, 70)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="390" height="340" rx="20" fill="url(#cardGlow)" stroke="rgba(197, 155, 39, 0.4)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="390" height="42" rx="20" fill="rgba(10, 28, 51, 0.85)" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" />
    <circle cx="38" cy="21" r="5" fill="#F59E0B" />
    <circle cx="52" cy="21" r="5" fill="#10B981" />
    <text x="200" y="25" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">presidency.command.console</text>

    <!-- Simulated Map Canvas with Radar Grid -->
    <rect x="18" y="58" width="354" height="150" rx="12" fill="#0A1828" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Radar Circle -->
    <circle cx="195" cy="133" r="55" fill="none" stroke="rgba(197, 155, 39, 0.2)" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="195" cy="133" r="30" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <line x1="140" y1="133" x2="250" y2="133" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <line x1="195" y1="78" x2="195" y2="188" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <!-- Campus Nodes -->
    <g transform="translate(145, 110)">
      <circle cx="0" cy="0" r="14" fill="rgba(239, 68, 68, 0.25)" />
      <circle cx="0" cy="0" r="6" fill="#EF4444" />
      <rect x="10" y="-8" width="60" height="16" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="#EF4444" stroke-width="0.8" />
      <text x="14" y="4" fill="#FCA5A5" font-family="sans-serif" font-size="8.5" font-weight="700">BLOCK A [CRIT]</text>
    </g>

    <g transform="translate(240, 140)">
      <circle cx="0" cy="0" r="12" fill="rgba(245, 158, 11, 0.25)" />
      <circle cx="0" cy="0" r="5" fill="#F59E0B" />
      <rect x="8" y="-7" width="55" height="15" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="#F59E0B" stroke-width="0.8" />
      <text x="12" y="4" fill="#FCD34D" font-family="sans-serif" font-size="8.5" font-weight="700">LIBRARY [OK]</text>
    </g>

    <!-- Simulated Live Ticket Feed -->
    <g transform="translate(18, 222)">
      <rect x="0" y="0" width="354" height="46" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="20" cy="23" r="6" fill="#EF4444" />
      <text x="36" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">CF-849201 • Exposed Conduit Arc</text>
      <text x="36" y="34" fill="#94A3B8" font-family="sans-serif" font-size="9.5">Engineering Block A • ETA: 20 mins • Gemini Triaged</text>
    </g>

    <g transform="translate(18, 276)">
      <rect x="0" y="0" width="354" height="46" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <circle cx="20" cy="23" r="6" fill="#10B981" />
      <text x="36" y="19" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="700">CF-619022 • High-Flow Pipe Leak</text>
      <text x="36" y="34" fill="#64748B" font-family="sans-serif" font-size="9.5">Hostel Block Ground Floor • Crew Dispatched</text>
    </g>
  </g>
</svg>
