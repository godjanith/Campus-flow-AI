<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F294A" />
      <stop offset="100%" stop-color="#0A1C33" />
    </linearGradient>
    <linearGradient id="goldBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F294A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1000" height="420" fill="#F8FAFC" />
  
  <!-- Outer Border -->
  <rect x="15" y="15" width="970" height="390" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="500" y="50" text-anchor="middle" font-family="'Merriweather', serif" font-size="20" font-weight="900" fill="#0F294A">CampusFlow AI • End-to-End System Topology</text>
  <text x="500" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#C59B27">Presidency University Flagship Architecture</text>

  <!-- Left: Client Clients -->
  <!-- Flutter Mobile App -->
  <g transform="translate(40, 100)" filter="url(#boxShadow)">
    <rect width="260" height="120" rx="12" fill="#FFFFFF" stroke="#0F294A" stroke-width="2" />
    <rect width="260" height="32" rx="12" fill="#0F294A" />
    <text x="130" y="21" text-anchor="middle" fill="#C59B27" font-family="sans-serif" font-size="12" font-weight="800">📱 FLUTTER MOBILE APP</text>
    <text x="15" y="52" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="700">• Royal Light Material 3 Theme</text>
    <text x="15" y="70" fill="#64748B" font-family="sans-serif" font-size="10.5">• GPS Geotagging + Image Compression</text>
    <text x="15" y="88" fill="#64748B" font-family="sans-serif" font-size="10.5">• Interactive Campus Vector Map View</text>
    <text x="15" y="106" fill="#64748B" font-family="sans-serif" font-size="10.5">• Offline SQLite/SharedPreferences Queue</text>
  </g>

  <!-- React Web Command Center -->
  <g transform="translate(40, 245)" filter="url(#boxShadow)">
    <rect width="260" height="120" rx="12" fill="#FFFFFF" stroke="#0F294A" stroke-width="2" />
    <rect width="260" height="32" rx="12" fill="#0F294A" />
    <text x="130" y="21" text-anchor="middle" fill="#C59B27" font-family="sans-serif" font-size="12" font-weight="800">💻 WEB COMMAND CENTER</text>
    <text x="15" y="52" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="700">• React 18 + Vite + Tailwind CSS</text>
    <text x="15" y="70" fill="#64748B" font-family="sans-serif" font-size="10.5">• Leaflet High-Res Satellite Twin</text>
    <text x="15" y="88" fill="#64748B" font-family="sans-serif" font-size="10.5">• Live Telemetry KPIs + Chart.js</text>
    <text x="15" y="106" fill="#64748B" font-family="sans-serif" font-size="10.5">• One-Click CSV Audit &amp; Simulation</text>
  </g>

  <!-- Middle: Node.js / Express Gateway & Socket.io Bus -->
  <g transform="translate(370, 130)" filter="url(#boxShadow)">
    <rect width="260" height="200" rx="14" fill="#0A1C33" stroke="#C59B27" stroke-width="2" />
    <rect width="260" height="36" rx="14" fill="#0F294A" />
    <text x="130" y="23" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">⚡ NODE.JS &amp; SOCKET.IO</text>
    
    <text x="15" y="62" fill="#F3E5AB" font-family="sans-serif" font-size="11" font-weight="700">RESTful API &amp; Real-Time Bus</text>
    <text x="15" y="82" fill="#E2E8F0" font-family="sans-serif" font-size="10.5">• Express 4 + Helmet + Compression</text>
    <text x="15" y="100" fill="#E2E8F0" font-family="sans-serif" font-size="10.5">• JWT Authentication &amp; RBAC</text>
    <text x="15" y="118" fill="#E2E8F0" font-family="sans-serif" font-size="10.5">• Multer Multi-Part Image Storage</text>
    <text x="15" y="136" fill="#E2E8F0" font-family="sans-serif" font-size="10.5">• Global Error &amp; Process Guards</text>
    <text x="15" y="154" fill="#E2E8F0" font-family="sans-serif" font-size="10.5">• Auto-Sim Background Telemetry</text>
    <text x="15" y="176" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">socket.io :5000 (ws &amp; polling)</text>
  </g>

  <!-- Right: Storage & AI Engine -->
  <!-- Gemini Multimodal AI -->
  <g transform="translate(700, 100)" filter="url(#boxShadow)">
    <rect width="260" height="120" rx="12" fill="url(#goldBox)" stroke="#C59B27" stroke-width="2" />
    <rect width="260" height="32" rx="12" fill="#C59B27" />
    <text x="130" y="21" text-anchor="middle" fill="#0F294A" font-family="sans-serif" font-size="12" font-weight="800">🧠 GOOGLE GEMINI AI</text>
    <text x="15" y="52" fill="#0F294A" font-family="sans-serif" font-size="11" font-weight="700">• Gemini 1.5 Pro / Flash Models</text>
    <text x="15" y="70" fill="#78350F" font-family="sans-serif" font-size="10.5">• Multimodal Image &amp; Hazard Vision</text>
    <text x="15" y="88" fill="#78350F" font-family="sans-serif" font-size="10.5">• SLA ETA &amp; Safety Advisories</text>
    <text x="15" y="106" fill="#78350F" font-family="sans-serif" font-size="10.5">• &lt;2ms Heuristic NLP Fallback Cascade</text>
  </g>

  <!-- MongoDB Compass Database -->
  <g transform="translate(700, 245)" filter="url(#boxShadow)">
    <rect width="260" height="120" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
    <rect width="260" height="32" rx="12" fill="#10B981" />
    <text x="130" y="21" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">🍃 MONGODB COMPASS</text>
    <text x="15" y="52" fill="#065F46" font-family="sans-serif" font-size="11" font-weight="700">• Local DB :27017 / campusflow_ai</text>
    <text x="15" y="70" fill="#64748B" font-family="sans-serif" font-size="10.5">• GeoJSON Coordinates &amp; 2dsphere</text>
    <text x="15" y="88" fill="#64748B" font-family="sans-serif" font-size="10.5">• Ticket Lifecycle Timeline Audit</text>
    <text x="15" y="106" fill="#64748B" font-family="sans-serif" font-size="10.5">• Auto-Seeded Presidency Admin/Demo</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Left to Middle -->
  <line x1="300" y1="160" x2="370" y2="200" stroke="#0F294A" stroke-width="2.5" stroke-dasharray="5 3" />
  <line x1="300" y1="305" x2="370" y2="260" stroke="#0F294A" stroke-width="2.5" stroke-dasharray="5 3" />

  <!-- Middle to Right -->
  <line x1="630" y1="200" x2="700" y2="160" stroke="#C59B27" stroke-width="2.5" />
  <line x1="630" y1="260" x2="700" y2="305" stroke="#10B981" stroke-width="2.5" />
</svg>
