name: campusflow_mobile
description: "CampusFlow AI — Mernova Competition-Grade Mobile App"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  provider: ^6.1.2
  connectivity_plus: ^6.0.3
  geolocator: ^13.0.1
  socket_io_client: ^3.0.2
  intl: ^0.19.0
  flutter_image_compress: ^2.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
